name: Publish approved collection to Pages

# Preparation only: no push, PR, tag or release event can publish.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'I approve publishing Arcade Collection 1.2.0 (Barrel Quest 1.1.0 + Code Snake)'
        type: boolean
        required: true
        default: false
      expected_sha:
        description: 'Full main commit SHA reviewed and approved for publication'
        type: string
        required: true

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'PedroCostinha/arcade-collection' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner &&
      github.ref == 'refs/heads/main' && inputs.publish &&
      inputs.expected_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run test:snake
      - run: npm run test:artifact
      - name: Require owner approval, exact SHA and matching collection/game versions
        env:
          PUBLISH_APPROVED: ${{ inputs.publish }}
          APPROVED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/verify-publication.mjs
      - name: Upload only the static build
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
          retention-days: 1
          include-hidden-files: true # The artifact allowlist admits only .nojekyll.

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read existing Pages configuration without enabling it
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: false
      - name: Publish the build artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
